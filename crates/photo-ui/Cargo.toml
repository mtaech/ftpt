[package]
name = "photo-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ftpt"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6.1"
photo-domain = { path = "../photo-domain" }
photo-engine = { path = "../photo-engine" }
photo-config = { path = "../photo-config" }
photo-recognize = { path = "../photo-recognize" }

anyhow = "1"
chrono = { workspace = true }
image = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
trash = { workspace = true }
open = "5"
# 系统剪贴板（复制图片）。GPUI 自带的剪贴板在 Linux（X11/Wayland）只写文本、
# 图片项会被静默丢弃，所以图片复制直接走 arboard；
# wayland-data-control：Wayland 会话下用 wl-clipboard-rs 的 data-control 协议。
arboard = { version = "3", features = ["wayland-data-control"] }
