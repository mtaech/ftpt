[package]
name = "photo-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ftpt"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.6.1"
photo-domain = { path = "../photo-domain" }
photo-engine = { path = "../photo-engine" }
photo-config = { path = "../photo-config" }
photo-recognize = { path = "../photo-recognize" }

anyhow = "1"
chrono = { workspace = true }
image = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
trash = { workspace = true }
open = "5"
# 系统剪贴板（复制图片）。GPUI 自带的剪贴板在 Linux（X11/Wayland）只写文本、
# 图片项会被静默丢弃，所以图片复制直接走 arboard；
# wayland-data-control：Wayland 会话下用 wl-clipboard-rs 的 data-control 协议。
arboard = { version = "3", features = ["wayland-data-control"] }

# 「把源文件原字节挂上剪贴板」用的两个底层库（都在 arboard 的依赖树里，等于零新增版本）：
# - wl-clipboard-rs：Wayland 的 data-control，一次挂多个 MIME（arboard 不暴露这个能力）
# - x11rb：X11 那边自己写最小 selection 服务器（arboard 的同一套 API 但没公开）
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "emscripten"))))'.dependencies]
wl-clipboard-rs = "0.9"
x11rb = "0.13"

[dev-dependencies]
# 无头冒烟读 a11y 语义要用 gpui-base 的观察点（ElementSnapshot 能读 role /
# aria_label / selected），它由 gpui-kit 的 test-support 特性开启。
# dev-dependencies 的特性只在测试/示例构建里生效，正常 cargo build 不带它。
gpui-kit = { version = "0.6.1", features = ["test-support"] }
