[package]
name = "photo-tauri"
version.workspace = true
edition.workspace = true
description = "ftpt 照片管理工具（Tauri v2 版）"
default-run = "ftpt"

[lib]
name = "photo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 二进制名 ftpt（2026-08-11 迁移完成，统一定名；原 GPUI 版已删除）
[[bin]]
name = "ftpt"
path = "src/main.rs"

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript.workspace = true
photo-domain = { path = "../../photo-domain", features = ["specta"] }
photo-engine = { path = "../../photo-engine" }
photo-recognize = { path = "../../photo-recognize", features = ["specta"] }
photo-config = { path = "../../photo-config", features = ["specta"] }
# 系统字体枚举（设置面板字体下拉）：workspace 已 pin zed-industries/font-kit fork
font-kit.workspace = true
# 手动修正鸟种的时间戳（与 photo-recognize 同源）
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
percent-encoding = "2"

[build-dependencies]
tauri-build.workspace = true

[features]
# 生产构建必须启用（`tauri build` CLI 或打包脚本 --features custom-protocol 注入）：
# 转发 tauri/custom-protocol → tauri build.rs 不设 `dev` cfg → 运行时加载编译期嵌入的
# frontendDist 而非 devUrl。缺失时打包版 exe 启动即尝试连 localhost:1420（拒绝连接）
custom-protocol = ["tauri/custom-protocol"]
