[package]
name = "photo-tauri"
version.workspace = true
edition.workspace = true
description = "ftpt 照片管理工具（Tauri v2 版，GPUI 并行迁移期）"
default-run = "ftpt-next"

[lib]
name = "photo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 二进制名必须叫 ftpt-next：target/debug/ftpt.exe 是现役 GPUI 版，
# Q2 决策并行迁移期两个 app 并存，parity 验收后才统一定名（Phase 4）
[[bin]]
name = "ftpt-next"
path = "src/main.rs"

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript.workspace = true
photo-domain = { path = "../../photo-domain", features = ["specta"] }
photo-engine = { path = "../../photo-engine" }
photo-recognize = { path = "../../photo-recognize" }
photo-config = { path = "../../photo-config", features = ["specta"] }
# 系统字体枚举（设置面板字体下拉）：workspace 已 pin zed-industries/font-kit fork
font-kit.workspace = true
# 手动修正鸟种的时间戳（与 photo-recognize 同源）
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
percent-encoding = "2"

[build-dependencies]
tauri-build.workspace = true
