[workspace]
resolver = "2"
members = [
    "crates/photo-domain",
    "crates/photo-engine",
    "crates/photo-config",
    "crates/photo-recognize",
    "crates/rawlib",
    "crates/photo-tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
embed-resource = "2"
font-kit = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
jpeg-decoder = "0.3"
oneshot = "0.1"
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
parking_lot = "0.12"
rawlib = { path = "crates/rawlib" }
rayon = "1"
regex-lite = "0.1"
rfd = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tauri v2 迁移（photo-tauri crate）；specta/tauri-specta 当前为 2.0.0-rc 系列
specta = "2.0.0-rc"
specta-typescript = "0.0.12"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-specta = "2.0.0-rc"
thiserror = "2"
toml = "0.8"
trash = "4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
walkdir = "2"
winreg = "0.52"
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.dependencies.tempfile]
version = "3"

# 编解码 crate 在 debug 构建下也开优化：否则原图/缩略图解码慢 10-20 倍
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rawlib]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3
