[workspace]
resolver = "2"
members = [
    "crates/photo-domain",
    "crates/photo-engine",
    "crates/photo-config",
    "crates/photo-recognize",
    "crates/photo-tool-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
embed-resource = "2"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
kamadak-exif = "0.6"
oneshot = "0.1"
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
parking_lot = "0.12"
quick-xml = { version = "0.37", features = ["serialize"] }
rawlib = "0.7"
rayon = "1"
regex-lite = "0.1"
rfd = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
trash = "4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
walkdir = "2"
winreg = "0.52"
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.dependencies.tempfile]
version = "3"

# 编解码 crate 在 debug 构建下也开优化：否则原图/缩略图解码慢 10-20 倍
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rawlib]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3
