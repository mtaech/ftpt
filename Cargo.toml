[workspace]
resolver = "2"
members = [
    "crates/photo-domain",
    "crates/photo-engine",
    "crates/photo-config",
    "crates/photo-recognize",
    "crates/rawlib",
    "crates/photo-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
jpeg-decoder = "0.3"
oneshot = "0.1"
ort = { version = "=2.0.0-rc.12", features = ["directml"] }
parking_lot = "0.12"
rawlib = { path = "crates/rawlib" }
rayon = "1"
regex-lite = "0.1"
rfd = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# specta：domain/config/recognize 的可选 feature。原为 Tauri 版导出 TS 绑定用，
# Tauri 版（crates/photo-tauri）已于 2026-09-18 删除，feature 保留、默认构建不启用。
specta = "2.0.0-rc"
thiserror = "2"
toml = "0.8"
trash = "4"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-log = "0.2"
walkdir = "2"
winreg = "0.52"
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.dependencies.tempfile]
version = "3"

# 编解码 crate 在 debug 构建下也开优化：否则原图/缩略图解码慢 10-20 倍
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rawlib]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3

# 预览母版实测：39MP JPEG 生成 2560 母版，debug 7.45s vs release 0.55s（13.5x）。
# 瓶颈在像素循环所在的 crate——photo-engine 自己的缓冲处理，以及底层 JPEG 解码器。
# 这两个是"点开一张图就卡 7 秒"的直接原因，dev 下必须开优化。
[profile.dev.package.photo-engine]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3
